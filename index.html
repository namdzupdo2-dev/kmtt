<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DATA HUB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080b11;--card:#111823;--card2:#172131;--line:#283447;--txt:#f5f7fb;--muted:#8d99ab;--pri:#6878ff;--ok:#20c979;--bad:#ff5365;--warn:#e9aa32}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#070a10,#0d1420);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:14px}.top{position:sticky;top:0;z-index:10;background:#080b11ee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{max-width:1180px;margin:auto;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px}.badge,.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px}.nav{display:flex;gap:7px;overflow:auto;padding:10px 0}.nav button{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--muted);padding:9px 12px;border-radius:10px}.nav button.active{background:var(--pri);color:#fff;border-color:var(--pri)}.card{background:linear-gradient(180deg,#131c29,#0f1621);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px}.title{font-size:20px;font-weight:900;margin-bottom:10px}.sub,.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px}.stat b{display:block;font-size:22px;margin-top:4px}.field{margin-bottom:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,select,textarea{width:100%;background:#0a1018;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px;outline:0}textarea{min-height:130px}.btn{background:var(--pri);color:white;border:0;border-radius:10px;padding:10px 13px;font-weight:800}.btn.secondary{background:#263246}.btn.ok{background:#159b5d}.btn.warn{background:#9c721d}.btn.danger{background:#a72d3c}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.fit{flex:0 0 auto}.product{border:1px solid var(--line);background:#0d141e;border-radius:13px;padding:12px;margin:8px 0}.price{font-weight:900}.auth{max-width:430px;margin:8vh auto}.tabs{display:flex;gap:7px;margin-bottom:12px}.tabs>*{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px}.empty{text-align:center;color:var(--muted);padding:25px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;z-index:99;background:#141d2a;border:1px solid var(--line);border-radius:11px;padding:11px 14px;transition:.2s;max-width:90%}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.wrap{padding:9px}}
</style></head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://xkluafsvaxfbhxbiwpje.supabase.co';
const SUPABASE_KEY='sb_publishable_Q2fifBxuVAXMPcGryWM4Lw_u7xM608o';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let S={token:localStorage.getItem('dh_token')||'',user:null,tab:'bank',adminTab:'dashboard',users:[],products:[],stock:[],history:[],reg:[],settings:null,search:[]};
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=x=>Number(x||0).toLocaleString('vi-VN')+'đ';
function toast(x){let e=$('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
async function rpc(fn,args){let {data,error}=await db.rpc(fn,args||{});if(error)throw error;return data}
function j(x){try{return JSON.parse(x||'[]')}catch{return[]}}
async function boot(){if(!S.token)return auth();try{let r=await rpc('me',{p_token:S.token});if(!r.success){S.token='';localStorage.removeItem('dh_token');return auth()}S.user=r.user;await refresh();render()}catch(e){S.token='';localStorage.removeItem('dh_token');auth()}}
async function refresh(){if(!S.user)return;let m=await rpc('me',{p_token:S.token});if(!m.success){return logout()}S.user=m.user;if(S.user.role==='admin'){if(S.adminTab==='dashboard'||true){S.users=j(await rpc('admin_users',{p_token:S.token}));S.products=j(await rpc('admin_products',{p_token:S.token}));S.reg=j(await rpc('admin_reg_orders',{p_token:S.token}));S.history=j(await rpc('history_list',{p_token:S.token}));S.settings=await rpc('admin_settings',{p_token:S.token})}}else{S.stock=j(await rpc('bank_stock',{p_token:S.token}));if(S.tab==='acc')S.products=j(await rpc('acc_catalog',{p_token:S.token}));if(S.tab==='history')S.history=j(await rpc('history_list',{p_token:S.token}));if(S.tab==='reg')S.reg=j(await rpc('user_reg_orders',{p_token:S.token}))}}
function auth(){document.body.innerHTML='<div id="app"><div class="wrap"><div class="auth"><div class="card"><div class="title">DATA HUB</div><div class="sub">BANK DATA • ACC • REG ACC</div><div class="tabs"><button class="btn" onclick="authBox(0)">Đăng nhập</button><button class="btn secondary" onclick="authBox(1)">Đăng ký</button></div><div id="authbox"></div></div></div></div></div><div id="toast" class="toast"></div>';authBox(0)}
function authBox(reg){$('authbox').innerHTML=reg?'<div class="field"><label>Tài khoản</label><input id="ru"></div><div class="field"><label>Mật khẩu</label><input id="rp" type="password"></div><div class="field"><label>Nhập lại</label><input id="rp2" type="password"></div><button class="btn" style="width:100%" onclick="register()">Tạo tài khoản</button>':'<div class="field"><label>Tài khoản</label><input id="lu"></div><div class="field"><label>Mật khẩu</label><input id="lp" type="password"></div><button class="btn" style="width:100%" onclick="login()">Đăng nhập</button><div class="sub" style="margin-top:10px">User mới phải được admin duyệt.</div>'}
async function login(){try{let r=await rpc('login_account',{p_username:$('lu').value.trim(),p_password:$('lp').value});if(!r.success){toast(r.error==='NOT_APPROVED'?'Chưa được admin duyệt':r.error==='DISABLED'?'Tài khoản đã khóa':'Sai tài khoản hoặc mật khẩu');return}S.token=r.token;S.user=r.user;localStorage.setItem('dh_token',S.token);await refresh();render()}catch(e){toast(e.message)}}
async function register(){if($('rp').value!==$('rp2').value)return toast('Mật khẩu không khớp');try{await rpc('register_account',{p_username:$('ru').value.trim(),p_password:$('rp').value});toast('Đăng ký thành công, chờ admin duyệt');authBox(0)}catch(e){toast(e.message)}}
async function logout(){try{await rpc('logout_account',{p_token:S.token})}catch(e){}S.token='';S.user=null;localStorage.removeItem('dh_token');auth()}
function header(){return `<div class="top"><div class="topin"><div class="brand">DATA HUB<small>${S.user.role==='admin'?'ADMIN':'USER'}</small></div><div class="row"><span class="badge">${esc(S.user.username)}</span><span class="badge">${money(S.user.balance)}</span><button class="btn secondary fit" onclick="logout()">Thoát</button></div></div></div>`}
function render(){if(!S.user)return auth();document.body.innerHTML='<div id="app"></div><div id="toast" class="toast"></div>';if(S.user.role==='admin')$('app').innerHTML=header()+`<div class="wrap">${adminNav()}${adminPage()}</div>`;else $('app').innerHTML=header()+`<div class="wrap">${userNav()}${userPage()}</div>`}
function adminNav(){let a=[['dashboard','Tổng quan'],['products','Sản phẩm ACC'],['bank','Kho ngân hàng'],['users','Người dùng'],['reg','Đơn REG'],['history','Lịch sử'],['settings','Cài đặt']];return '<div class="nav">'+a.map(x=>`<button class="${S.adminTab===x[0]?'active':''}" onclick="S.adminTab='${x[0]}';refresh().then(render)">${x[1]}</button>`).join('')+'</div>'}
function userNav(){let a=[['bank','Ngân hàng'],['acc','Mua ACC'],['reg','REG ACC'],['history','Lịch sử']];return '<div class="nav">'+a.map(x=>`<button class="${S.tab===x[0]?'active':''}" onclick="S.tab='${x[0]}';refresh().then(render)">${x[1]}</button>`).join('')+'</div>'}
function adminPage(){switch(S.adminTab){case'products':return adminProducts();case'bank':return adminBank();case'users':return adminUsers();case'reg':return adminReg();case'history':return historyPage(true);case'settings':return adminSettings();default:return dashboard()}}
function dashboard(){let us=S.users.filter(x=>x.role==='user'),pending=us.filter(x=>!x.approved&&!x.disabled).length,stock=S.products.reduce((a,x)=>a+Number(x.stock||0),0),pr=S.reg.filter(x=>x.status==='pending').length;return `<h1 class="title">Tổng quan</h1><div class="grid"><div class="stat">Users<b>${us.length}</b></div><div class="stat">Chờ duyệt<b>${pending}</b></div><div class="stat">Kho ACC<b>${stock}</b></div><div class="stat">Đơn REG chờ<b>${pr}</b></div><div class="stat">Sản phẩm<b>${S.products.length}</b></div><div class="stat">Lịch sử<b>${S.history.length}</b></div></div><div class="card"><b>Admin mặc định:</b> admin / 123456<br><span class="muted">Telegram từng user được admin gán ở Người dùng và không xuất hiện trong giao diện user.</span></div>`}
function adminUsers(){let us=S.users.filter(x=>x.role!=='admin');return `<div class="card"><div class="title">Người dùng</div><div class="tablewrap"><table><thead><tr><th>User</th><th>Trạng thái</th><th>Số dư</th><th>Telegram Chat ID</th><th>Thao tác</th></tr></thead><tbody>${us.map(u=>`<tr><td><b>${esc(u.username)}</b></td><td>${u.disabled?'🔴 Khóa':u.approved?'🟢 Duyệt':'🟡 Chờ'}</td><td>${money(u.balance)}</td><td><input id="tg_${u.id}" value="${esc(u.telegram_chat_id||'')}" placeholder="Chat ID"></td><td><div class="row"><button class="btn ok fit" onclick="setUser('${u.id}',true,false)">Duyệt</button><button class="btn warn fit" onclick="addBalance('${u.id}')">+ Tiền</button><button class="btn danger fit" onclick="setUser('${u.id}',${u.approved},${!u.disabled})">${u.disabled?'Mở':'Khóa'}</button><button class="btn secondary fit" onclick="saveTG('${u.id}')">Lưu TG</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
async function setUser(id,approved,disabled){let u=S.users.find(x=>x.id===id);try{await rpc('admin_set_user',{p_token:S.token,p_user_id:id,p_approved:approved,p_disabled:disabled,p_telegram:$('tg_'+id)?.value||u.telegram_chat_id||''});toast('Đã cập nhật');await refresh();render()}catch(e){toast(e.message)}}
async function saveTG(id){let u=S.users.find(x=>x.id===id);try{await rpc('admin_set_user',{p_token:S.token,p_user_id:id,p_approved:u.approved,p_disabled:u.disabled,p_telegram:$('tg_'+id).value.trim()});toast('Đã lưu Telegram');await refresh();render()}catch(e){toast(e.message)}}
async function addBalance(id){let n=prompt('Số tiền cộng');let v=Number(n);if(!(v>0))return;try{await rpc('admin_add_balance',{p_token:S.token,p_user_id:id,p_amount:v});toast('Đã cộng '+money(v));await refresh();render()}catch(e){toast(e.message)}}
function adminProducts(){return `<div class="card"><div class="title">Tạo sản phẩm ACC</div><div class="grid2"><div class="field"><label>Tên</label><input id="pn" placeholder="SC88 - ACC Lẻ"></div><div class="field"><label>Loại</label><select id="pt"><option value="single">ACC Lẻ</option><option value="combo2">Combo 2</option><option value="combo3">Combo 3</option></select></div><div class="field"><label>Giá</label><input id="pp" type="number" value="0"></div><div class="field"><label>Mô tả</label><input id="pd"></div></div><button class="btn" onclick="createProduct()">Tạo sản phẩm</button></div><div class="card"><div class="title">Sản phẩm / kho</div>${S.products.map(p=>`<div class="product"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.description)} • ${p.type} • còn ${p.stock}</div></div><b class="price fit">${money(p.price)}</b></div><div class="row" style="margin-top:8px"><button class="btn secondary fit" onclick="uploadPack('${p.id}')">Upload kho</button><button class="btn warn fit" onclick="editProduct('${p.id}')">Sửa</button><button class="btn danger fit" onclick="deleteProduct('${p.id}')">Xóa</button></div></div>`).join('')||'<div class="empty">Chưa có sản phẩm</div>'}</div>`}
async function createProduct(){try{await rpc('admin_product_save',{p_token:S.token,p_id:null,p_name:$('pn').value,p_type:$('pt').value,p_desc:$('pd').value,p_price:Number($('pp').value||0),p_active:true});toast('Đã tạo');await refresh();render()}catch(e){toast(e.message)}}
async function editProduct(id){let p=S.products.find(x=>x.id===id),n=prompt('Tên',p.name),pr=prompt('Giá',p.price),d=prompt('Mô tả',p.description||'');if(n===null||pr===null)return;try{await rpc('admin_product_save',{p_token:S.token,p_id:id,p_name:n,p_type:p.type,p_desc:d||'',p_price:Number(pr),p_active:p.active});await refresh();render()}catch(e){toast(e.message)}}
async function deleteProduct(id){if(!confirm('Xóa sản phẩm và kho của nó?'))return;try{await rpc('admin_product_delete',{p_token:S.token,p_id:id});await refresh();render()}catch(e){toast(e.message)}}
async function uploadPack(id){let p=S.products.find(x=>x.id===id),need=p.type==='single'?1:p.type==='combo2'?2:3;let raw=prompt(`Mỗi package cách nhau bằng dòng trống. Mỗi dòng TK|MK. Package cần ${need} tài khoản.${need>1?' Dòng đầu có thể là NOTE: ghi chú.':''}`);if(raw===null)return;try{let packs=raw.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).map(block=>{let l=block.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),note='';if(/^NOTE\s*:/i.test(l[0]))note=l.shift().replace(/^NOTE\s*:/i,'').trim();let accounts=l.map(x=>{let a=x.split('|');return{username:(a[0]||'').trim(),password:a.slice(1).join('|').trim()}}).filter(x=>x.username&&x.password);if(accounts.length!==need)throw Error('Sai số TK trong package');return{note,accounts}});await rpc('admin_acc_upload',{p_token:S.token,p_product_id:id,p_packages:packs});toast('Đã upload '+packs.length+' package');await refresh();render()}catch(e){toast(e.message)}}
function adminBank(){return `<div class="card"><div class="title">Upload kho ngân hàng</div><div class="sub">Mỗi dòng: STK|Tên|Ngân hàng. Giá: ${money(S.settings?.bank_price||1000)}/data.</div><textarea id="bankraw" placeholder="121225051999|LE THI HUONG|Vietcombank"></textarea><button class="btn" style="margin-top:8px" onclick="uploadBank()">Upload</button></div><div class="card"><div class="title">Kho hiện tại</div><div class="grid">${S.stock.map(x=>`<div class="stat">${esc(x.bank_name)}<b>${x.qty}</b></div>`).join('')||'<div class="empty">Kho trống</div>'}</div></div>`}
async function uploadBank(){let rows=$('bankraw').value.split(/\r?\n/).map(x=>{let a=x.split('|');return{stk:a[0]?.trim(),account_name:a[1]?.trim(),bank_name:a.slice(2).join('|').trim()}}).filter(x=>x.stk&&x.account_name&&x.bank_name);try{let r=await rpc('admin_bank_upload',{p_token:S.token,p_rows:rows});toast('Đã thêm '+r.count+' data');await refresh();render()}catch(e){toast(e.message)}}
function userPage(){switch(S.tab){case'acc':return userAcc();case'reg':return userReg();case'history':return historyPage(false);default:return userBank()}}
function userBank(){return `<div class="card"><div class="title">Kho ngân hàng</div><div class="grid">${S.stock.map(x=>`<div class="stat">${esc(x.bank_name)}<b>${x.qty}</b></div>`).join('')||'<div class="empty">Kho trống</div>'}</div></div><div class="card"><div class="title">Lấy data</div><div class="grid2"><div class="field"><label>Ngân hàng</label><select id="tb"><option value="">Chọn ngân hàng</option>${S.stock.map(x=>`<option>${esc(x.bank_name)}</option>`).join('')}</select></div><div class="field"><label>Số lượng</label><input id="tq" type="number" min="1" value="1"></div></div><button class="btn" onclick="takeBank(false)">Lấy</button> <button class="btn secondary" onclick="takeBank(true)">Random toàn kho</button></div><div class="card"><div class="title">Tìm theo tên</div><div class="sub">Tối thiểu 4 ký tự.</div><div class="row"><input id="sn" placeholder="Ví dụ: LE THI"><button class="btn fit" onclick="searchBank()">Tìm</button></div><div id="sr" style="margin-top:10px">${S.search.map(x=>`<div class="product"><b>${esc(x.bank_name)}</b> — ${x.qty} data<button class="btn" style="margin-left:8px" onclick="takeSearch('${esc(x.bank_name)}')">Lấy</button></div>`).join('')}</div></div>`}
async function searchBank(){let n=$('sn').value.trim();if(n.length<4)return toast('Nhập ít nhất 4 ký tự');try{S.search=j(await rpc('bank_search',{p_token:S.token,p_name:n}));render();setTimeout(()=>{let e=$('sn');if(e)e.value=n},0)}catch(e){toast(e.message)}}
async function takeBank(random){let q=Number($('tq').value||1),b=random?'':$('tb').value;if(!random&&!b)return toast('Chọn ngân hàng');try{let r=await rpc('take_bank',{p_token:S.token,p_bank:b,p_qty:q,p_search:'',p_random:random});showResult(r);await refresh();render()}catch(e){toast(e.message)}}
async function takeSearch(bank){let q=Number(prompt('Số lượng','1')||0);if(!q)return;try{let r=await rpc('take_bank',{p_token:S.token,p_bank:bank,p_qty:q,p_search:$('sn').value.trim(),p_random:false});showResult(r);await refresh();render()}catch(e){toast(e.message)}}
function showResult(r){let x=(r.items||[]).map(a=>`${a.stk}|${a.account_name}|${a.bank_name}`).join('\n');alert('ĐÃ LẤY '+(r.items||[]).length+' DATA\n\n'+x+'\n\n'+(r.price?'Đã trừ: '+money(r.price):''))}
function userAcc(){return `<div class="card"><div class="title">Mua ACC</div><div class="sub">Combo 2/3 là package riêng, không tự ghép từ ACC lẻ.</div>${S.products.map(p=>`<div class="product"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.description)} • còn ${p.stock}</div></div><b class="price fit">${money(p.price)}</b></div><button class="btn" style="width:100%;margin-top:8px" ${p.stock<1?'disabled':''} onclick="buyAcc('${p.id}')">${p.stock<1?'Hết hàng':'Mua ngay'}</button></div>`).join('')||'<div class="empty">Chưa có ACC</div>'}</div>`}
async function buyAcc(id){if(!confirm('Xác nhận mua?'))return;try{let r=await rpc('buy_acc',{p_token:S.token,p_product_id:id});alert('MUA THÀNH CÔNG\n\n'+(r.accounts||[]).map(x=>x.username+'|'+x.password).join('\n')+(r.note?'\n\nNOTE: '+r.note:'')+'\n\n'+(r.price?'Đã trừ '+money(r.price):''));await refresh();render()}catch(e){toast(e.message)}}
function userReg(){return `<div class="card"><div class="title">REG ACC</div><div class="sub">Phí: ${money(S.settings?.reg_price||0)}. Telegram của user do admin gán, không hiển thị ở đây.</div><div class="grid2"><div class="field"><label>STK</label><input id="rs"></div><div class="field"><label>Tên chủ tài khoản</label><input id="rn"></div><div class="field"><label>Ngân hàng</label><input id="rb"></div><div class="field"><label>Ghi chú</label><input id="rno"></div></div><button class="btn" onclick="createReg()">Tạo đơn</button></div><div class="card"><div class="title">Đơn của tôi</div>${regTable(S.reg,false)}</div>`}
async function createReg(){try{let r=await rpc('create_reg_order',{p_token:S.token,p_stk:$('rs').value,p_account_name:$('rn').value,p_bank_name:$('rb').value,p_note:$('rno').value});toast('Đã tạo '+r.order_code);await refresh();render()}catch(e){toast(e.message)}}
function status(s){return{pending:'Chờ xử lý',processing:'Đang xử lý',completed:'Hoàn thành',cancelled:'Hủy'}[s]||s}
function regTable(a,admin){return a.length?`<div class="tablewrap"><table><thead><tr><th>Mã</th><th>User</th><th>Thông tin</th><th>Giá</th><th>Trạng thái</th><th>Thời gian</th>${admin?'<th>Đổi</th>':''}</tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.order_code)}</td><td>${esc(x.username)}</td><td>${esc(x.stk)}<br>${esc(x.account_name)}<br>${esc(x.bank_name)}${x.note?'<br>'+esc(x.note):''}</td><td>${money(x.price)}</td><td>${status(x.status)}</td><td>${new Date(x.created_at).toLocaleString('vi-VN')}</td>${admin?`<td><select onchange="changeReg('${x.id}',this.value)"><option value="">Chọn</option>${['pending','processing','completed','cancelled'].map(s=>`<option value="${s}">${status(s)}</option>`).join('')}</select></td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có đơn</div>'}
function adminReg(){return `<div class="card"><div class="title">Đơn REG ACC</div>${regTable(S.reg,true)}</div>`}async function changeReg(id,s){if(!s)return;try{await rpc('admin_reg_status',{p_token:S.token,p_order_id:id,p_status:s});toast('Đã cập nhật');await refresh();render()}catch(e){toast(e.message)}}
function historyPage(admin){return `<div class="card"><div class="title">${admin?'Lịch sử hệ thống':'Lịch sử của tôi'}</div>${S.history.length?`<div class="tablewrap"><table><thead><tr><th>Thời gian</th><th>Loại</th><th>Nội dung</th></tr></thead><tbody>${S.history.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('vi-VN')}</td><td>${esc(x.type)}</td><td>${esc(x.description)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có lịch sử</div>'}</div>`}
function adminSettings(){let s=S.settings||{};return `<div class="card"><div class="title">Cài đặt</div><div class="grid2"><div class="field"><label>Giá bank data</label><input id="bp" type="number" value="${s.bank_price||1000}"></div><div class="field"><label>Giá REG ACC</label><input id="rp" type="number" value="${s.reg_price||0}"></div><div class="field"><label>Kho thấp</label><input id="ls" type="number" value="${s.low_stock||3}"></div><div class="field"><label>Telegram Bot Token</label><input id="tt" value="${esc(s.telegram_token||'')}"></div><div class="field"><label>Telegram Chat ID admin</label><input id="tc" value="${esc(s.telegram_chat_id||'')}"></div></div><button class="btn" onclick="saveSettings()">Lưu</button></div><div class="card"><b>Telegram user:</b><div class="muted">Gán Chat ID tại tab Người dùng. User không có trường Telegram trong giao diện.</div></div>`}
async function saveSettings(){try{await rpc('admin_save_settings',{p_token:S.token,p_bank_price:Number($('bp').value),p_reg_price:Number($('rp').value),p_low_stock:Number($('ls').value),p_telegram_token:$('tt').value,p_telegram_chat_id:$('tc').value});toast('Đã lưu');await refresh();render()}catch(e){toast(e.message)}}
boot();
</script></body></html>
